appId: social.emera
---
- launchApp:
    clearState: true
- extendedWaitUntil: {visible: "Get started", timeout: 20000}
- takeScreenshot: ${OUT}/welcome
- tapOn: "Get started"
- extendedWaitUntil: {visible: "Send my code", timeout: 8000}
- takeScreenshot: ${OUT}/sign-in
- tapOn: "you@example.com"
- inputText: "ios@example.com"
- tapOn: "Send my code"
- extendedWaitUntil: {visible: "Check your email", timeout: 8000}
- takeScreenshot: ${OUT}/code
- inputText: "123456"
- extendedWaitUntil: {visible: "What's your name?", timeout: 8000}
- takeScreenshot: ${OUT}/handle
- tapOn: "Your name"
- inputText: "Iris Test"
- hideKeyboard
- tapOn: "Start"
- waitForAnimationToEnd: {timeout: 4000}
- takeScreenshot: ${OUT}/feed
- openLink: "emera:///explore"
- waitForAnimationToEnd: {timeout: 4000}
- takeScreenshot: ${OUT}/explore
