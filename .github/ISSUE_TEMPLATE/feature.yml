name: Feature request
description: Suggest something Emera should do
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem it solves
      description: Who is stuck, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like to see
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways to solve it
