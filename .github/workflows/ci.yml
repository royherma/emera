name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npm run check
  site:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/site } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/site/package-lock.json }
      - run: npm ci
      - run: node scripts/build.mjs
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tools/atlas/package-lock.json }
      - run: npm ci --prefix tools/atlas
      - run: node tools/atlas/build.mjs
  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no personal details in tracked files
        run: "! git grep -n -I -E 'royherma''@|/Users/''royhermannn' -- ."
