<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf5ea; --ink: #2a1d14; --ink2: #6b5846; --chip: rgba(42,29,20,0.07); --chipInk: #4a3a2c;
    --glow1: rgba(255,194,74,0.55); --glow2: rgba(255,138,43,0.35); --frame: #2a1d14; --shadow: rgba(60,35,10,0.28);
  }
  body.night {
    --bg: #0c0a09; --ink: #fbf5ea; --ink2: #c9b8a4; --chip: rgba(251,245,234,0.08); --chipInk: #e9dccb;
    --glow1: rgba(255,170,60,0.30); --glow2: rgba(255,120,30,0.22); --frame: #3a302a; --shadow: rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 560px; overflow: hidden; }
  body {
    background:
      radial-gradient(620px 420px at 78% 8%, var(--glow1), transparent 70%),
      radial-gradient(520px 380px at 100% 95%, var(--glow2), transparent 70%),
      var(--bg);
    color: var(--ink); font-family: 'DM Sans', sans-serif; position: relative;
  }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 104px; height: 104px; color: var(--ink); margin-left: -10px; }
  .brand h1 { font: 800 112px/1 'Sora', sans-serif; letter-spacing: -0.045em; }
  .line { font: 700 40px/1.12 'Sora', sans-serif; letter-spacing: -0.025em; margin-top: 28px; }
  .tag { font-size: 23px; color: var(--ink2); margin-top: 14px; font-weight: 500; }
  .chips { display: flex; gap: 8px; margin-top: 30px; flex-wrap: nowrap; }
  .chip { background: var(--chip); color: var(--chipInk); font-weight: 600; font-size: 15px; padding: 8px 13px; white-space: nowrap; border-radius: 999px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, #ffc24a, #ff8a2b); }
  .phones { position: absolute; right: 24px; top: 0; width: 600px; height: 560px; }
  .phone { position: absolute; width: 210px; height: 454px; border-radius: 34px; padding: 7px; background: var(--frame);
           box-shadow: 0 30px 60px -18px var(--shadow), 0 0 0 1px rgba(255,255,255,0.06) inset; }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 28px; display: block; }
  .p1 { left: 8px; top: 92px; transform: rotate(-7deg); }
  .p2 { left: 196px; top: 46px; z-index: 2; width: 226px; height: 488px; }
  .p3 { left: 392px; top: 92px; transform: rotate(7deg); }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><span id="mark"></span><h1>Emera</h1></div>
    <div class="line">The open source social network</div>
    <div class="tag">Where humanity comes together</div>
    <div class="chips">
      <span class="chip"><span class="dot"></span>Signed posts</span>
      <span class="chip"><span class="dot"></span>Real people</span>
      <span class="chip"><span class="dot"></span>Open algorithm</span>
      <span class="chip"><span class="dot"></span>AT Protocol</span>
    </div>
  </div>
  <div class="phones">
    <div class="phone p1"><img id="s1"></div>
    <div class="phone p2"><img id="s2"></div>
    <div class="phone p3"><img id="s3"></div>
  </div>
</body>
</html>
