# Emera feature comparison. Read by tools/atlas (Features tab). Summary: docs/feature-comparison.md
# Emera status is derived, not stored: built = every mapped screen and endpoint exists in data/atlas.json and at least one of each;
# partial = a story or some mapped code exists but something is missing; not built = no mapping.
platforms: [instagram, tiktok, youtube, pinterest, bluesky, cara, pixelfed, vsco]
features:
  - id: email-signup-signin
    name: "Sign up and sign in with an email code"
    area: account
    tier: core
    usage: "Nobody uses a network they cannot get into; every other feature sits behind it"
    why_core: "Front door: no account, no creators"
    platforms: {instagram: yes, tiktok: yes, youtube: yes, pinterest: yes, bluesky: yes, cara: yes, pixelfed: yes, vsco: yes}
    emera:
      twist: "Own Emera account on the AT Protocol, no password, no Bluesky login needed"
      maps_to: {screens: ["/welcome", "/sign-in", "/code"], endpoints: ["POST /v1/auth/start", "POST /v1/auth/verify", "GET /v1/me", "POST /v1/auth/logout"], stories: ["join-with-invite", "sign-in-again", "sign-out"]}
      help_wanted: false
      effort: M
  - id: handle-claim
    name: "Claim a handle and display name"
    area: account
    tier: core
    usage: "Your name is how people find and tag you"
    why_core: "Identity before the first post"
    platforms: {instagram: yes, tiktok: yes, youtube: yes, pinterest: yes, bluesky: yes, cara: yes, pixelfed: yes, vsco: yes}
    emera:
      twist: "A handle you can carry with you if you move hosts"
      maps_to: {screens: ["/handle"], endpoints: ["POST /v1/auth/handle"], stories: ["pick-handle"]}
      help_wanted: false
      effort: S
  - id: invite-codes
    name: "Join with an invite from a friend"
