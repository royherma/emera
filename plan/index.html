<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emera plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--ink:#1c1a17;--card:#fff;--a:#e2573a;--a2:#2f7a5b;--mute:#7a746b;--line:#e4ded3;--soft:#faf8f3}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:13px/1.35 Inter,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
button,input{font-family:inherit}
.serif{font-family:Fraunces,Georgia,serif}
header{display:flex;align-items:center;gap:20px;padding:8px 20px 6px}
header h1{font-size:24px;font-weight:600;line-height:1}
header h1 small{display:block;font:500 11px Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.goal{flex:1;font-size:15px;font-weight:600}
.goal span{display:block;font-size:11px;font-weight:500;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
.prog i{width:200px;height:8px;border-radius:9px;background:var(--line);overflow:hidden;display:block}
.prog i b{display:block;height:100%;background:var(--a2);border-radius:9px}
.lk{display:flex;gap:4px;padding:0 20px 8px;flex-wrap:nowrap;overflow:hidden;align-items:center}.lk em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 2px 0 8px}.lk em:first-child{margin-left:0}.lk a{font-size:11.5px;font-weight:600;color:var(--ink);text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}.lk a:hover{border-color:var(--ink)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.empty{color:var(--mute);font-size:12px;padding:6px 0}
.rvbtn{border:0;border-radius:10px;background:var(--a);color:#fff;font:700 13px Inter,system-ui,sans-serif;padding:8px 14px;cursor:pointer;white-space:nowrap}.rvbtn.off{background:var(--ink)}
body.rv main,body.rv .ws{display:none}#review{display:none;flex:1;padding:0 20px 14px;overflow:auto;min-height:0}body.rv #review{display:block}
.rvgrid{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-flow:dense;gap:10px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:5px;min-width:0}
.rc.wide{grid-column:span 2}.rc.wide3{grid-column:span 3}.rc .imgs.many{grid-template-columns:repeat(8,1fr);gap:6px}.rc .imgs.many .opt{padding:3px;font-size:11px;gap:1px}.rc .imgs.many .opt img{height:auto;aspect-ratio:1;object-fit:cover}.rc.tall{grid-row:span 2}
.rc .top{display:flex;gap:6px;align-items:center;font:700 10px Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.rc .top i{font-style:normal;border-radius:5px;padding:1px 6px;background:#fde6c8;color:#8a5212}.rc .top i.pick{background:#e5ecf7;color:#36527f}.rc .top i.approve{background:#e7f3ec;color:var(--a2)}.rc .top i.money{background:#f4e1dc;color:#a8452f}
.rc .top span{margin-left:auto}.rc .top span.now{color:var(--a)}
.rc > b{font-size:14.5px;line-height:1.2}.rc > p{font-size:11.5px;color:var(--mute);line-height:1.3}
.rc .rec{font-size:11.5px;font-weight:600;color:var(--a2)}
.rc .imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.rc .opt{border:2px solid var(--line);border-radius:12px;padding:6px;background:var(--soft);cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;font:600 12px Inter,system-ui,sans-serif;position:relative}
.rc .opt:hover{border-color:var(--ink)}.rc .opt.on{border-color:var(--a2);box-shadow:0 0 0 2px var(--a2)}
.rc .opt img{width:100%;height:150px;object-fit:contain;border-radius:8px;background:#fff}.rc .opt img.wm{height:22px}
.rc .opt.mine::after{content:"my pick";position:absolute;top:-8px;right:8px;font-size:9px;font-weight:700;background:var(--a);color:#fff;padding:0 5px;border-radius:4px}
.rc .lks{display:flex;flex-wrap:wrap;gap:5px}.rc .lks a{font:600 12px Inter,system-ui,sans-serif;color:var(--ink);text-decoration:none;border:1px solid var(--ink);border-radius:8px;padding:4px 9px}.rc .lks a:hover{background:var(--ink);color:#fff}
.rc ol{margin:0;padding-left:18px;font-size:12px;line-height:1.45}
.rc textarea,.rc input.chg{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:12px Inter,system-ui,sans-serif;resize:vertical}
.rc .acts{display:flex;gap:6px;margin-top:auto;padding-top:4px;align-items:center;flex-wrap:wrap}
.rc .acts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.rc .acts button.p{background:var(--ink);color:#fff;border-color:var(--ink)}.rc .acts button:hover{border-color:var(--ink)}
.rc .acts .ch{border:0;background:none;color:var(--mute);text-decoration:underline;padding:6px 4px;margin-left:auto}
.rc.answered{opacity:.55;background:var(--soft)}.rc.answered:hover{opacity:1}
.rc .ans{font-size:12px;font-weight:700;color:var(--a2)}.rc .ans button{border:0;background:none;color:var(--mute);text-decoration:underline;cursor:pointer;font:500 11.5px Inter,system-ui,sans-serif}
.rvhead{display:flex;align-items:baseline;gap:12px;margin:2px 0 10px}.rvhead b{font:600 20px Fraunces,Georgia,serif}.rvhead span{font-size:12px;color:var(--mute)}
.rvdone{margin-top:10px;font-size:11.5px;color:var(--mute)}.rvdone s{color:var(--ink)}
@media (max-width:1100px){.rvgrid{grid-template-columns:repeat(2,1fr)}}
body{min-height:560px}
.dbtn{border:1px solid var(--line);background:#fff;border-radius:10px;font:600 12.5px Inter,system-ui,sans-serif;padding:8px 12px;cursor:pointer;color:var(--ink);white-space:nowrap}.dbtn:hover{border-color:var(--ink)}
.dpop{position:fixed;top:56px;right:20px;width:420px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px #0002;padding:12px 14px;z-index:9}
.dpop b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:6px 0 4px}.dpop div{font-size:12.5px;padding:4px 0;border-top:1px solid var(--line)}.dpop div span{color:var(--mute)}
.ws{display:flex;gap:6px;padding:0 20px 8px;align-items:center;overflow:hidden}.ws em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap}.ws div{min-width:0;flex:0 1 auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ws div i{width:7px;height:7px;border-radius:50%;background:var(--a);animation:pl 1.2s infinite;flex:0 0 auto}.ws div.done i{background:var(--a2);animation:none}.ws div.paused i{background:var(--mute);animation:none}.ws button{border:0;background:none;color:var(--mute);text-decoration:underline;font:500 11.5px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
@keyframes pl{50%{opacity:.45}}
main{flex:1;display:flex;gap:10px;padding:0 20px 8px;min-height:380px;overflow-x:auto}
.donecol{flex:0 0 190px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.donecol > b{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:4px 2px 0}
.dph{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center}.dph small{margin-left:auto;color:var(--a2);font-weight:700}.dph:hover{border-color:var(--ink)}
.dlist{display:flex;flex-direction:column;gap:3px;margin:-2px 0 4px}
.col{flex:1 1 0;min-width:230px;background:var(--soft);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0}
.col.now{background:#fff;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.col.later{flex:0.8 1 0;background:transparent;border-style:dashed}
.col.over{box-shadow:0 0 0 2px var(--a2);border-color:var(--a2)}
.ch{padding:10px 12px 6px}.ch h3{font-size:14.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.ch h3 i{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.06em;background:var(--a);color:#fff;border-radius:5px;padding:1px 6px}
.ch h3 small{margin-left:auto;font-size:11px;color:var(--mute);font-weight:600}
.ch p{font-size:11.5px;color:var(--mute);margin-top:2px;line-height:1.3}
.ch .pct{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:7px}.ch .pct b{display:block;height:100%;background:var(--a2)}
.list{flex:1;overflow:auto;padding:4px 10px 10px;display:flex;flex-direction:column;gap:5px;min-height:60px}
.task{display:flex;gap:7px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:grab}
.task:hover{border-color:#bdb6aa}.task.dragging{opacity:.35}
.task input{margin-top:2px;accent-color:var(--a2);cursor:pointer}
.task span{flex:1;outline:none;font-size:12.5px;line-height:1.3}.task span[contenteditable=true]{cursor:text;box-shadow:0 0 0 2px var(--a2);border-radius:3px}
.task em{font-style:normal;font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 5px;white-space:nowrap;margin-top:2px;border:0}
.task em.roy{background:#fde6c8;color:#8a5212}.task em.claude{background:#e5ecf7;color:#36527f}.task em.run{background:#e7f3ec;color:var(--a2);animation:pl 1.4s ease-in-out infinite}
button.task-ask{cursor:pointer}button.task-ask:hover{outline:1px solid #8a5212}
.task.done span{text-decoration:line-through;color:var(--mute)}
.drop{height:3px;border-radius:3px;background:var(--a2);margin:-1px 0}
.add{border:1px dashed var(--line);background:none;color:var(--mute);border-radius:9px;padding:6px 9px;font:500 12px Inter,system-ui,sans-serif;cursor:pointer;text-align:left}.add:hover{color:var(--ink);border-color:var(--ink)}
.newcol{flex:0 0 120px;border:1px dashed var(--line);border-radius:14px;background:none;color:var(--mute);font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer}.newcol:hover{color:var(--ink);border-color:var(--ink)}
.tell{display:flex;gap:8px;padding:0 20px 12px}.tell input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:#fff}.tell button{border:0;border-radius:10px;background:var(--ink);color:#fff;font:600 12.5px Inter,system-ui,sans-serif;padding:0 16px;cursor:pointer}
body.rv .tell{display:none}
</style>
</head>
<body>
<header>
  <h1 class="serif">Emera <small>emera.social · plan</small></h1>
  <div class="goal"><span>Goal</span><div id="goal"></div></div>
  <div class="prog"><i><b id="bar"></b></i><span id="count"></span><span id="upd"></span></div>
  <button class="dbtn" id="dbtn"></button>
  <button class="rvbtn" id="rvbtn"></button>
</header>
<div class="dpop" id="dpop" hidden></div>
<div class="lk" id="lk"></div>
<div class="ws" id="ws"></div>
<section id="review"></section>
<main id="board"></main>
<form class="tell" id="tell"><input id="tellIn" placeholder="Tell Claude: an idea, a change, something to add..."><button>Send</button></form>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let plan; let nameGroup;
const toast = (t) => { $('toast').textContent = t; $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 1600); };
async function send(f, msg) {
  const r = await fetch('/api/feedback', { method: 'POST', body: JSON.stringify(f) });
  toast(r.ok ? (msg || 'Sent to Claude') : 'Did not save');
}
function render() {
  $('goal').textContent = plan.goal;
  $('upd').textContent = `Updated ${plan.updated}`;
  const tasks = plan.phases.flatMap((p) => p.tasks);
  const done = tasks.filter((t) => t.done).length;
  $('count').textContent = `${Math.round((100 * done) / Math.max(1, tasks.length))}% · ${done} / ${tasks.length} steps`;
  $('bar').style.width = tasks.length ? `${(100 * done) / tasks.length}%` : '0';

  renderReview();
  const tabs = [['decs', 'Decisions'], ['mission', 'Mission']];
  window.tab ??= 'decs';
  const tb = $('tabs'); tb.replaceChildren();
  for (const [id, label, n] of tabs) { const b = el('button', id === window.tab ? 'on' : '', label); if (n) b.append(el('b', '', n)); b.onclick = () => { window.tab = id; render(); }; tb.append(b); }
  for (const [id] of tabs) $(id).hidden = id !== window.tab;
  const lk = $('lk'); lk.replaceChildren(); let lastG;
  for (const [g, label, url] of plan.links ?? []) { if (g !== lastG) { lk.append(el('em', '', g)); lastG = g; } const a = el('a', '', label); a.href = url; a.target = '_blank'; a.rel = 'noopener'; lk.append(a); }
  const ws = $('ws'); ws.replaceChildren();
  const wAll = plan.workstreams ?? []; const wRun = wAll.filter((w) => w.state === 'running'); const wDone = wAll.filter((w) => w.state !== 'running');
  ws.append(el('em', 'wh', wRun.length ? `Running now (${wRun.length})` : 'Nothing running'));
  for (const w of [...wRun, ...(window.wsOpen ? wDone : [])]) { const d = el('div', w.state); const b = el('b', ''); b.append(el('i'), w.name); d.append(b, el('span', '', w.note)); if (w.owner) d.title = w.owner; ws.append(d); }
  const tg = el('button', 'wt', window.wsOpen ? 'Hide done' : `${wDone.length} done`); tg.onclick = () => { window.wsOpen = !window.wsOpen; render(); }; ws.append(tg);
  const mi = $('mission'); mi.replaceChildren(); mi.className = 'mis';
  if (plan.mission) { if (plan.mission.why) mi.append(el('div', 'why', `Why: ${plan.mission.why}`)); mi.append(el('p', '', plan.mission.mission)); for (const v of plan.mission.values) { const d = el('div', 'v'); d.append(el('b', '', v.name), el('span', '', v.line)); mi.append(d); } mi.append(el('div', 'why', `v${plan.mission.version} · improves by community vote, see docs/mission`)); }
  const decs = $('decs'); decs.replaceChildren();
  if (!plan.decisions.length) decs.append(el('div', 'empty', 'Filling in...'));
  const decided = plan.decisions.filter((d) => d.pick && d.id !== 'logo');
  const open = plan.decisions.filter((d) => !decided.includes(d));
  if (decided.length) { const box = el('div', 'dec'); box.append(el('b', '', `Decided (${decided.length})`), el('p', '', decided.map((d) => `${d.q.replace('?', '')}: ${d.options.find((o) => o.id === d.pick)?.label}`).join(' · '))); decs.append(box); }
  for (const d of open) {
    const box = el('div', 'dec');
    box.append(el('b', '', d.q), el('p', '', d.why));
    const chips = el('div', 'chips');
    for (const o of d.options) {
      const c = el('button', 'chip', o.label);
      if (o.id === d.mine) c.classList.add('mine');
      if (o.id === (d.pick ?? d.mine)) c.classList.add('on');
      if (o.note) c.title = o.note;
      c.onclick = () => { d.pick = o.id; render(); send({ kind: 'pick', id: d.id, pick: o.id, label: o.label, q: d.q }, `Picked: ${o.label}`); };
      chips.append(c);
    }
    box.append(chips); decs.append(box);
  }

  if ($('nameNote')) $('nameNote').textContent = plan.names.note;
  const names = $('names'); names.replaceChildren();
  const groups = plan.names.groups ?? [];
  nameGroup ??= groups[0]?.[0];
  const ng = $('ngroups'); ng.replaceChildren();
  for (const [g, label] of groups) { const b = el('button', g === nameGroup ? 'on' : '', `${label} (${plan.names.items.filter((n) => (n.group ?? 'mine') === g).length})`); b.onclick = () => { nameGroup = g; render(); }; ng.append(b); }
  for (const n of plan.names.items.filter((x) => !nameGroup || (x.group ?? 'mine') === nameGroup || x.added)) {
    if (n.group === 'r2') {
      const card = el('div', `nm big ${n.vote ?? ''}`);
      card.title = `${n.why}${n.conflictWhy ? '\n\nClash: ' + n.conflictWhy : ''}`;
      card.append(el('div', 'wm', n.name), el('div', 'dm', n.domain), el('div', 'st', n.stance));
      if (n.check) card.append(el('div', 'ph2', n.check));
      const btns = el('div', 'btns');
      for (const [v, label, cls] of [['keep', 'Keep', 'k'], ['drop', 'Drop', 'd']]) { const b = el('button', cls, label); b.onclick = () => { n.vote = n.vote === v ? null : v; render(); send({ kind: 'name-vote', id: n.id, name: n.name, vote: n.vote }, `${n.name}: ${n.vote ?? 'cleared'}`); }; btns.append(b); }
      card.append(btns); names.append(card); continue;
    }
    const card = el('div', `nm ${n.vote ?? ''}`);
    const t = el('div', 't'); t.append(el('b', '', n.name)); card.append(t, el('div', 'why', n.why));
    if (n.phrase) card.append(el('div', 'ph2', `Ranks for: ${n.phrase}`));
    const dom = el('div', 'dom');
    for (const [d, s] of Object.entries(n.domains ?? {})) { const s1 = el('span', s, d); s1.title = s === 'free' ? 'no registration found' : s === 'taken' ? 'registered' : 'unknown'; dom.append(s1); }
    card.append(dom);
    const btns = el('div', 'btns');
    for (const [v, label, cls] of [['keep', 'Keep', 'k'], ['drop', 'Drop', 'd']]) {
      const b = el('button', cls, label);
      b.onclick = () => { n.vote = n.vote === v ? null : v; render(); send({ kind: 'name-vote', id: n.id, name: n.name, vote: n.vote }, `${n.name}: ${n.vote ?? 'cleared'}`); };
      btns.append(b);
    }
    card.append(btns); names.append(card);
  }

  if (plan.brand) {
    $('brandNote').textContent = plan.brand.note;
    const bs = $('brands'); bs.replaceChildren();
    for (const b of plan.brand.items) {
      const card = el('div', `bd ${b.png ? 'has' : ''} ${b.vote ?? ''}`);
      const img = el('div', 'img', b.png ? null : 'Drawing...');
      if (b.png) { const im = el('img'); im.src = `/file/${b.png}?v=${plan.updated}`; im.onclick = () => window.open(`/file/${b.html}`, '_blank'); img.append(im); }
      const meta = el('div', 'meta'); meta.append(el('b', '', b.name), el('span', ''));
      if (b.png) { const k = el('button', '', b.vote === 'keep' ? 'Picked' : 'Pick this'); k.onclick = () => { for (const o of plan.brand.items) o.vote = o === b && b.vote !== 'keep' ? 'keep' : null; render(); send({ kind: 'brand-vote', id: b.id, name: b.name, vote: b.vote }, `${b.name}: ${b.vote ?? 'cleared'}`); }; meta.append(k); }
      card.append(img, meta); bs.append(card);
    }
  }
  const phases = $('phases'); phases.replaceChildren();
  for (const p of plan.phases) {
    const box = el('div', 'ph');
    const dn = p.tasks.filter((t) => t.done).length; const pc = p.tasks.length ? Math.round((100 * dn) / p.tasks.length) : 0;
    const h = el('h3', '', p.title); const bar = el('span', 'pct'); const fill = el('b'); fill.style.width = `${pc}%`; bar.append(fill); h.append(bar, el('small', '', `${pc}%`));
    box.append(h, el('div', 'sub', p.sub));
    for (const t of p.tasks) {
      const row = el('label', `task ${t.done ? 'done' : ''}`);
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!t.done;
      cb.onchange = () => { t.done = cb.checked; render(); send({ kind: 'task-toggle', id: t.id, text: t.text, done: t.done }); };
      const span = el('span', '', t.text); span.contentEditable = true; span.spellcheck = false;
      span.onblur = () => { if (span.textContent !== t.text) { t.text = span.textContent; send({ kind: 'task-edit', id: t.id, text: t.text }, 'Edit saved'); } };
      span.onclick = (e) => e.preventDefault();
      row.append(cb, span, t.running && !t.done ? el('i', 'run', 'agent working') : el('i', t.who, t.who === 'roy' ? 'you' : 'Claude'));
      box.append(row);
    }
    const add = el('button', 'add', '+ add a step');
    add.onclick = () => { const text = prompt('New step'); if (text) send({ kind: 'task-add', phase: p.id, text }, 'Step added'); };
    box.append(add); phases.append(box);
  }
}
let rvMode; try { rvMode = sessionStorage.getItem('rv'); } catch {}
let openDecs;
const WHEN = { now: 0, 'this week': 1, later: 2 };
const TAG = { pick: 'Pick', decide: 'Decide', do: 'You do', type: 'Tell me', approve: 'Approve', money: 'Money' };
function changeBox(card, onSend) {
  const ch = el('button', 'ch', 'Change...');
  ch.onclick = () => {
    const inp = el('input', 'chg'); inp.placeholder = 'What should change? Enter to send';
    inp.onkeydown = (e) => { if (e.key === 'Enter' && inp.value.trim()) onSend(inp.value.trim()); };
    card.insertBefore(inp, card.querySelector('.acts')); inp.focus(); ch.remove();
  };
  return ch;
}
function renderReview() {
  const box = $('review'); box.replaceChildren();
  openDecs ??= new Set(plan.decisions.filter((d) => !d.pick).map((d) => d.id));
  const decs = plan.decisions.filter((d) => openDecs.has(d.id)).map((d) => ({ ...d, kind: 'pick', title: d.q, when: 'now', answered: !!d.pick, dec: d }));
  const items = [...decs, ...(plan.review ?? []).map((r) => ({ ...r, answered: !!r.answer }))];
  items.sort((a, b) => a.answered - b.answered || (WHEN[a.when] ?? 1) - (WHEN[b.when] ?? 1));
  const left = items.filter((x) => !x.answered).length;
  if (!rvMode) rvMode = left ? 'on' : 'off';
  document.body.classList.toggle('rv', rvMode === 'on');
  const btn = $('rvbtn'); btn.className = `rvbtn ${rvMode === 'on' ? 'off' : ''}`;
  btn.textContent = rvMode === 'on' ? 'Back to plan' : `Review · ${left} for you`;
  btn.onclick = () => { rvMode = rvMode === 'on' ? 'off' : 'on'; try { sessionStorage.setItem('rv', rvMode); } catch {} render(); };
  const head = el('div', 'rvhead'); head.append(el('b', '', left ? `${left} things need you` : 'Nothing needs you'), el('span', '', 'Click a button and it reaches Claude. Faded cards are answered; click Undo to change.'));
  const grid = el('div', 'rvgrid'); box.append(head, grid);
  for (const it of items) {
    const hasImg = it.dec?.options.some((o) => o.img);
    const many = (it.dec?.options.filter((o) => o.img).length ?? 0) > 6;
    const card = el('div', `rc ${hasImg ? (many ? 'wide3 tall' : 'wide tall') : ''} ${it.list ? 'tall' : ''} ${it.answered ? 'answered' : ''}`);
    const top = el('div', 'top'); top.append(el('i', it.kind === 'pick' || it.kind === 'decide' ? 'pick' : it.kind, TAG[it.kind] ?? it.kind), el('span', it.when === 'now' ? 'now' : '', it.when));
    card.append(top, el('b', '', it.title), el('p', '', it.why));
    if (it.dec) {
      const d = it.dec;
      const pick = (o) => { d.pick = o.id; render(); send({ kind: 'pick', id: d.id, pick: o.id, label: o.label, q: d.q }, `Picked: ${o.label}`); };
      if (hasImg) {
        const imgs = el('div', many ? 'imgs many' : 'imgs');
        for (const o of d.options.filter((x) => x.img)) {
          const b = el('button', `opt ${o.id === d.mine ? 'mine' : ''} ${o.id === d.pick ? 'on' : ''}`);
          const im = el('img'); im.src = `/file/${o.img}`; im.alt = o.label; b.append(im);
          if (o.img2) { const w = el('img', 'wm'); w.src = `/file/${o.img2}`; w.alt = ''; b.append(w); }
          b.append(o.label); b.onclick = () => pick(o); imgs.append(b);
        }
        card.append(imgs);
      }
      const mine = d.options.find((o) => o.id === d.mine);
      if (mine) card.append(el('div', 'rec', `My pick: ${mine.label}${mine.note ? ' - ' + mine.note : ''}`));
      const acts = el('div', 'acts');
      if (d.pick) { const a = el('div', 'ans', `You picked: ${d.options.find((o) => o.id === d.pick)?.label} `); acts.append(a); }
      else for (const o of d.options.filter((x) => !x.img)) {
        if (o.href) { const a = el('a', '', o.label); a.href = o.href; a.target = '_blank'; a.className = 'ch'; a.style.marginLeft = '0'; acts.append(a); continue; }
        const b = el('button', o.id === d.mine ? 'p' : '', o.label); b.onclick = () => pick(o); acts.append(b);
      }
      if (!d.pick) acts.append(changeBox(card, (text) => send({ kind: 'decision-note', id: d.id, note: text }, 'Sent to Claude')));
      card.append(acts); grid.append(card); continue;
    }
    if (it.links) { const l = el('div', 'lks'); for (const [t, u] of it.links) { const a = el('a', '', `${t} ↗`); a.href = u; a.target = '_blank'; a.rel = 'noopener'; l.append(a); } card.append(l); }
    if (it.list) { const ol = el('ol'); for (const t of it.list) ol.append(el('li', '', t)); card.append(ol); }
    let ta;
    if (it.kind === 'type' && !it.answered) { ta = el('textarea'); ta.rows = 2; ta.placeholder = it.placeholder; card.append(ta); }
    if (it.rec) card.append(el('div', 'rec', `My pick: ${it.rec}`));
    const acts = el('div', 'acts');
    const answer = (answer, text) => { const r = plan.review.find((x) => x.id === it.id); r.answer = answer; r.text = text; render(); send({ kind: 'review', id: it.id, title: it.title, answer, text }, answer ? `${it.title}: ${answer}` : 'Undone'); };
    if (it.answered) {
      const o = it.options.find((x) => x.id === it.answer);
      const a = el('div', 'ans', `You: ${o?.label ?? it.answer}${it.text ? ' - ' + it.text : ''} `);
      const u = el('button', '', 'Undo'); u.onclick = () => answer(null, null); a.append(u); acts.append(a);
    } else {
      for (const o of it.options) {
        const b = el('button', o.primary ? 'p' : '', o.label);
        b.onclick = () => { const text = ta?.value.trim(); if (it.kind === 'type' && o.id === 'send' && !text) { ta.focus(); return; } answer(o.id, text || null); };
        acts.append(b);
      }
      acts.append(changeBox(card, (text) => answer('change', text)));
    }
    card.append(acts); grid.append(card);
  }
  if (plan.reviewDone?.length) { const d = el('div', 'rvdone', 'Already done, removed: '); plan.reviewDone.forEach(([t, ev], i) => { if (i) d.append(' · '); d.append(el('s', '', t), ` (${ev})`); }); box.append(d); }
}
$('tell').onsubmit =(e) => { e.preventDefault(); const text = $('tellIn').value.trim(); if (!text) return; $('tellIn').value = ''; send({ kind: 'note', text }); };
async function load() { plan = await (await fetch('/plan.json')).json(); if (!document.activeElement?.isContentEditable) render(); }
load();
new EventSource('/events').onmessage = load;
</script>
